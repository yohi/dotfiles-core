---
# ansible/roles/common-setup/tasks/main.yml
- name: Ensure operator SSH public key is authorized
  ansible.posix.authorized_key:
    user: "{{ username }}"
    state: present
    key: "{{ lookup('ansible.builtin.file', ssh_public_key_path) }}"
  become: true
  become_user: "{{ username }}"

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
  become: true

- name: Set default shell for target user
  ansible.builtin.user:
    name: "{{ username }}"
    shell: "{{ default_shell }}"
  become: true


- name: Ensure Netplan enables DHCPv4 on all Ethernet interfaces
  ansible.builtin.copy:
    dest: /etc/netplan/99-custom-ethernet-dhcp.yaml
    content: |
      network:
        version: 2
        ethernets:
          all-ethernets:
            match:
              name: "e*"
            dhcp4: true
            optional: true
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Apply Netplan
  ansible.builtin.command: netplan apply
  become: true

- name: Clone dotfiles-core repository
  ansible.builtin.git:
    repo: "git@github.com:yohi/dotfiles-core.git"
    dest: "/home/{{ username }}/dotfiles"
    accept_hostkey: true
    key_file: "/home/{{ username }}/.ssh/id_ed25519"
    version: master
  become: true
  become_user: "{{ username }}"

- name: Check if UFW is installed
  ansible.builtin.command: which ufw
  register: ufw_check
  failed_when: false
  changed_when: false

- name: Allow new SSH port via UFW
  community.general.ufw:
    rule: allow
    port: "{{ new_ssh_port | string }}"
    proto: tcp
  when: ufw_check.rc == 0

- name: Check if ssh.socket is active
  ansible.builtin.systemd:
    name: ssh.socket
  register: ssh_socket_status
  failed_when: false

- name: Ensure ssh.socket.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Configure ssh.socket port override
  ansible.builtin.copy:
    content: |
      [Socket]
      ListenStream=
      ListenStream={{ new_ssh_port }}
      ListenStream=0.0.0.0:{{ new_ssh_port }}
    dest: /etc/systemd/system/ssh.socket.d/override.conf
    owner: root
    group: root
    mode: '0640'
  register: ssh_socket_override

- name: Force systemd daemon-reload and reset-failed for ssh.socket
  ansible.builtin.systemd:
    daemon_reload: true
  when: ssh_socket_override.changed

- name: Reset ssh.socket and ssh.service failed states
  ansible.builtin.command: systemctl reset-failed ssh.service ssh.socket
  changed_when: false
  failed_when: false
  when: ssh_socket_override.changed

- name: Ensure ssh.service is stopped and disabled
  ansible.builtin.systemd:
    name: ssh
    enabled: false
    state: stopped

- name: Ensure ssh.socket is enabled and started
  ansible.builtin.systemd:
    name: ssh.socket
    enabled: true
    state: started

- name: Remove custom Port from sshd_config (socket activation handles port)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Port\s'
    state: absent
  notify: Restart SSH

- name: Disable SSH Root Login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin\s'
    line: "PermitRootLogin no"
    state: present
  notify: Restart SSH

- name: Disable SSH Password Authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s'
    line: "PasswordAuthentication no"
    state: present
  notify: Restart SSH

- name: Flush handlers to restart SSH immediately
  ansible.builtin.meta: flush_handlers

- name: Switch Ansible to the hardened SSH endpoint
  ansible.builtin.set_fact:
    ansible_port: "{{ new_ssh_port }}"
    ansible_user: "{{ username }}"

- name: Reset the previous SSH control connection
  ansible.builtin.meta: reset_connection

- name: Verify SSH authentication and command execution on the new port
  ansible.builtin.wait_for_connection:
    timeout: 30
  become: false

- name: Gather the effective SSH daemon configuration over the new connection
  ansible.builtin.command: sshd -T
  become: true
  changed_when: false
  register: sshd_effective_config

- name: Assert the SSH hardening is reflected in the effective configuration
  ansible.builtin.assert:
    that:
      - '"permitrootlogin no" in sshd_effective_config.stdout_lines'
      - '"passwordauthentication no" in sshd_effective_config.stdout_lines'
    fail_msg: >-
      SSH の実効設定 (sshd -T) が要求されたハードニング設定と一致しません。
      期待値は 'permitrootlogin no' / 'passwordauthentication no' です。
      /etc/ssh/sshd_config.d/*.conf のドロップインが上書きしていないか確認してください。
    success_msg: >-
      SSH の実効設定 (sshd -T) が要求されたハードニング設定
      (permitrootlogin no, passwordauthentication no) と一致することを確認しました。
